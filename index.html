<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ventana">
<meta name="theme-color" content="#0d0f11">
<title>Cámara Ventana</title>
<style>
/* Visor: un monitor oscuro a propósito. El video manda; todo lo demás es tenue. Un solo tema. */
:root{
  --bg:#0d0f11;
  --surface:#16191c;
  --line:#262a2f;
  --text:#eef0f2;
  --muted:#8a9198;
  --glass:#9cc3e4;     /* acento: reflejo de vidrio */
  --ok:#47c08a;
  --live:#ff5143;
  --warn:#f0b04a;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --display:-apple-system-headline, -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{padding-top:max(14px, env(safe-area-inset-top));padding-bottom:max(18px, env(safe-area-inset-bottom));
  padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right))}
[hidden]{display:none!important}
.app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font-family:var(--display);font-size:20px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill[data-s="espera"] i{background:var(--ok)}
.pill[data-s="espera"]{color:var(--text)}
.pill[data-s="encendiendo"] i,.pill[data-s="permiso"] i{background:var(--warn)}
.pill[data-s="en-vivo"]{color:var(--text);border-color:rgba(255,81,67,.45)}
.pill[data-s="en-vivo"] i{background:var(--live);animation:pulse 1.6s ease-in-out infinite}
.pill[data-s="sin-ruta"] i{background:var(--warn)}
.pill[data-s="buscando"] i{background:var(--glass)}
.pill[data-s="apagada"] i,.pill[data-s="sin-red"] i{background:transparent;box-shadow:0 0 0 1.5px var(--muted) inset}
@keyframes pulse{50%{opacity:.3}}

/* Monitor */
.monitor{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;max-height:72vh;border-radius:18px;overflow:hidden;background:#050607;border:1px solid var(--line)}
.monitor video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.idle p{margin:0;max-width:30ch;font-size:15px;line-height:1.45;color:var(--muted)}
.idle strong{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:4px}
.pane{opacity:.9}
.monitor[data-s="encendiendo"] .pane{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
  background:linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0));font-size:12px;font-weight:700;letter-spacing:.08em;
  font-variant-numeric:tabular-nums;color:#fff;pointer-events:none}
.hud .rec{display:inline-flex;align-items:center;gap:7px}
.hud .rec i{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-in-out infinite}
.full{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:10px;border:0;background:rgba(0,0,0,.5);color:#fff;
  display:grid;place-items:center;cursor:pointer}

/* Controles */
.main{width:100%;padding:17px 20px;border-radius:16px;border:0;font:inherit;font-size:17px;font-weight:650;cursor:pointer;
  background:var(--text);color:var(--bg);transition:transform .12s ease, opacity .2s ease}
.main:active{transform:scale(.985)}
.main.off{background:transparent;color:var(--live);box-shadow:0 0 0 1.5px rgba(255,81,67,.55) inset}
.main:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--glass);outline-offset:2px}
.facts{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.facts button{font:inherit;color:var(--glass);background:none;border:0;padding:0;cursor:pointer}
.diag{font-size:12px;color:#5f666d;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}

/* Código */
.setup{display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.setup h2{margin:0;font-size:18px;font-weight:650}
.setup p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.setup input{font:inherit;font-size:19px;letter-spacing:.06em;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.err{min-height:18px;font-size:13px;color:var(--warn)}

/* Teléfono de costado con video en vivo: el monitor ocupa toda la pantalla */
@media (orientation:landscape) and (max-height:540px){
  body.live .monitor{position:fixed;left:0;top:0;width:100%;height:100%;max-height:none;aspect-ratio:auto;border-radius:0;border:0;z-index:5;background:#000}
  body.live .hud{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  body.live .full{display:none}
  body.live .monitor video{object-fit:cover}
  body.live .monitor.entera video{object-fit:contain}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2.5" y="2.5" width="21" height="21" rx="3" fill="none" stroke="#9cc3e4" stroke-width="1.6"/><path d="M13 2.5v21M2.5 13h21" stroke="#9cc3e4" stroke-width="1.6"/><path d="M5.5 9.5l3-3M15.5 19.5l3-3" stroke="#9cc3e4" stroke-width="1.2" opacity=".6"/></svg>
      <h1>Cámara Ventana</h1>
    </div>
    <span class="pill" id="pill" data-s="sin-red"><i></i><span id="pillText">Conectando</span></span>
  </header>

  <section class="setup" id="setup" hidden>
    <h2>Código de la cámara</h2>
    <p>El mismo que pusiste en el iPhone 5s. Queda guardado en este teléfono.</p>
    <input id="code" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Código">
    <button class="main" id="save" type="button">Conectar</button>
    <div class="err" id="err"></div>
  </section>

  <section id="view" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="monitor" id="monitor" data-s="sin-red">
        <video id="video" playsinline autoplay muted hidden></video>
        <div class="idle" id="idle">
          <svg class="pane" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="52" height="52" rx="6" fill="none" stroke="#9cc3e4" stroke-width="2"/><path d="M32 6v52M6 32h52" stroke="#9cc3e4" stroke-width="2"/><path d="M13 23l9-9M39 49l9-9" stroke="#9cc3e4" stroke-width="1.6" opacity=".55"/></svg>
          <p id="idleText"><strong>Conectando con la cámara</strong>Un momento.</p>
        </div>
        <div class="hud" id="hud" hidden><span class="rec"><i></i>EN VIVO <span id="elapsed">00:00</span></span><span id="now">--:--</span></div>
        <button class="full" id="full" type="button" aria-label="Pantalla completa" hidden>
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7V2h5M11 2h5v5M16 11v5h-5M7 16H2v-5" fill="none" stroke="#fff" stroke-width="1.8"/></svg>
        </button>
      </div>
      <button class="main" id="toggle" type="button" disabled>Encender cámara</button>
      <div class="facts diag"><span id="diag">Diagnóstico: iniciando</span></div>
      <div class="facts"><span id="fact">Si salís de esta pantalla, la cámara se apaga sola.</span><button id="change" type="button">Cambiar código</button></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'camaraVentana.codigo';
  var $ = function (id) { return document.getElementById(id); };
  var code = '';
  try { code = localStorage.getItem(KEY) || ''; } catch (e) {}

  function hash(str, seed) {
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed, i, ch;
    for (i = 0; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  function camId(c) { return 'cventana-' + hash(c, 1) + hash(c, 7); }
  function peerOptions() {
    var m = /[?&]srv=([^&]+)/.exec(location.search);
    var o = { debug: 1 };
    if (m) {
      var p = decodeURIComponent(m[1]).split(':');
      o.host = p[0]; o.port = parseInt(p[1] || '443', 10); o.path = '/'; o.secure = o.port === 443;
    }
    return o;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function mmss(ms) { var s = Math.max(0, Math.floor(ms / 1000)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }

  // ---------- Estado en pantalla ----------
  var cam = 'sin-red', camMsg = '', liveSince = 0;
  var PILL = { 'sin-red': 'Conectando', 'buscando': 'Buscando cámara', 'sin-ruta': 'Sin ruta', 'apagada': 'Sin cámara', 'espera': 'En espera', 'encendiendo': 'Encendiendo',
    'en-vivo': 'En vivo', 'permiso': 'Falta permiso', 'error': 'Error' };
  var IDLE = {
    'sin-red': ['Conectando al servidor', 'Si tarda más de 20 segundos, el servidor gratuito de conexión puede estar caído. Reintento solo.'],
    'buscando': ['Conectando con el 5s', 'El servidor respondió. Abriendo la conexión directa con la cámara.'],
    'sin-ruta': ['La cámara está, pero no hay camino', 'El 5s está conectado, pero los dos teléfonos no pueden verse. Suele pasar con datos móviles: hace falta un relé. Reintento solo.'],
    'apagada': ['La cámara no está conectada', 'Fijate que el 5s tenga Safari abierto en la página de la cámara, con la pantalla encendida y wifi.'],
    'espera': ['La cámara está en espera', 'Tocá Encender para ver en vivo. Mientras tanto no filma ni gasta casi batería.'],
    'encendiendo': ['Encendiendo la cámara', 'Tarda unos segundos.'],
    'permiso': ['El 5s está pidiendo permiso', 'Safari quiere confirmar el uso de la cámara. Hay que tocar Permitir en el 5s. Pasa a veces después de recargar la página.'],
    'error': ['La cámara tuvo un problema', '']
  };
  function render() {
    $('pill').setAttribute('data-s', cam);
    $('pillText').textContent = (PILL[cam] || cam) + (cam === 'buscando' ? ' · ' + Math.round((Date.now() - since) / 1000) + ' s' : '');
    $('monitor').setAttribute('data-s', cam);
    var live = cam === 'en-vivo' && hasVideo;
    $('video').hidden = !live; $('hud').hidden = !live; $('full').hidden = !live;
    $('idle').hidden = live;
    document.body.className = live ? 'live' : '';
    var t = IDLE[cam] || IDLE['sin-red'];
    $('idleText').innerHTML = '';
    var s = document.createElement('strong'); s.textContent = t[0]; $('idleText').appendChild(s);
    $('idleText').appendChild(document.createTextNode(camMsg || t[1]));
    var btn = $('toggle');
    var on = cam === 'en-vivo' || cam === 'encendiendo' || cam === 'permiso';
    btn.textContent = on ? 'Apagar cámara' : 'Encender cámara';
    btn.className = on ? 'main off' : 'main';
    btn.disabled = !(conn && conn.open) || cam === 'sin-red' || cam === 'buscando' || cam === 'sin-ruta' || cam === 'apagada';
    $('diag').textContent = 'Diagnóstico: servidor ' + (peer && peer.open ? 'conectado' : 'no conectado') +
      ' · cámara ' + (conn && conn.open ? 'conectada' : (cam === 'apagada' ? 'no registrada' : cam === 'sin-ruta' ? 'sin ruta directa' : 'buscando')) +
      (conn && conn.open && route ? ' · ' + route : '') +
      (conn && conn.open && connectMs ? ' · conectó en ' + (connectMs / 1000).toFixed(1) + ' s' : '') +
      (lastErr ? ' · ' + lastErr : '') + ' · ' + (navigator.onLine === false ? 'sin internet' : 'online');
  }

  // ---------- Conexión ----------
  var peer = null, conn = null, call = null, hasVideo = false, retry = null, openTimer = null, lastErr = '', since = Date.now();
  function send(m) { if (conn && conn.open) { try { conn.send(m); } catch (e) {} } }

  function start() {
    clearTimeout(retry); retry = null; clearTimeout(openTimer);
    closeAttempts(); conn = null; call = null; hasVideo = false;
    if (peer) { var old = peer; peer = null; try { old.destroy(); } catch (e) {} }
    var p = new Peer(peerOptions());
    peer = p; since = Date.now();
    if (cam !== 'apagada' && cam !== 'sin-ruta') { cam = 'sin-red'; render(); }
    p.on('open', function () { if (p === peer) { lastErr = ''; connectCam(); } });
    p.on('call', function (c) {
      if (call) { try { call.close(); } catch (e) {} }
      call = c;
      c.answer();
      c.on('stream', function (s) {
        var v = $('video'); v.srcObject = s;
        var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
        hasVideo = true; render();
        v.onloadedmetadata = v.onresize = function () {
          if (v.videoWidth && v.videoHeight) $('monitor').style.aspectRatio = v.videoWidth + ' / ' + v.videoHeight;
        };
      });
      var end = function () { if (call === c) { call = null; hasVideo = false; $('video').srcObject = null; render(); } };
      c.on('close', end); c.on('error', end);
    });
    p.on('error', function (err) {
      if (p !== peer) return;
      if (!(err && err.type === 'peer-unavailable')) lastErr = 'error ' + (err && err.type ? err.type : '?');
      if (err && err.type === 'peer-unavailable') {
        var msg = String(err.message || '');
        attempts.forEach(function (a) { if (msg.indexOf(a.id) >= 0) a.unavailable = true; });
        if (!conn && attempts.some(function (a) { return !a.c && !a.gone; })) launchRest(); // el último lugar está vacío: probar los otros ya
        settleFailed(); return;
      }
      cam = 'sin-red'; render(); later(start, 6000);
    });
    p.on('disconnected', function () { if (p === peer) later(function () { try { p.reconnect(); } catch (e) { start(); } }, 3000); });
  }
  function later(fn, ms) { clearTimeout(retry); retry = setTimeout(function () { retry = null; fn(); }, ms); }

  // La cámara puede estar en cualquiera de 3 lugares del servidor: pruebo los 3 y me quedo con el que contesta.
  var SLOTS = 3, attempts = [];
  function slotId(i) { return camId(code) + '-' + i; }
  function closeAttempts(keep) {
    var list = attempts; attempts = [];
    clearTimeout(staggerTimer); staggerTimer = null;
    list.forEach(function (a) { if (a.c !== keep) { a.gone = true; if (a.c) { try { a.c.close(); } catch (e) {} } } });
  }
  function settleFailed() {
    if (conn || !attempts.length) return;
    if (!attempts.every(function (a) { return a.gone || a.unavailable; })) return;
    clearTimeout(openTimer);
    var found = attempts.some(function (a) { return !a.unavailable; });
    attempts = [];
    cam = found ? 'sin-ruta' : 'apagada'; camMsg = ''; lastErr = found ? 'la cámara no contestó' : '';
    render(); later(connectCam, found ? 1500 : 4000);
  }
  // Empieza por el último lugar que funcionó; los otros dos se prueban 1,5 s después si hace falta.
  var SLOT_KEY = KEY + '.lugar', lastSlot = -1, staggerTimer = null, connectMs = 0, route = '';
  try { lastSlot = parseInt(localStorage.getItem(SLOT_KEY), 10); if (!(lastSlot >= 0 && lastSlot < SLOTS)) lastSlot = -1; } catch (e) {}
  function launch(a) {
    if (a.c || a.gone || !peer || !peer.open) return;
    var c = peer.connect(a.id, { serialization: 'json', reliable: true });
    a.c = c;
    c.on('open', function () { try { c.send({ t: 'hola', code: code }); } catch (e) {} });
    c.on('data', function (m) { onData(c, m); });
    var end = function () {
      a.gone = true;
      if (conn === c) { conn = null; hasVideo = false; route = ''; cam = 'apagada'; camMsg = ''; render(); later(connectCam, 1500); }
      else settleFailed();
    };
    c.on('close', end); c.on('error', end);
  }
  function launchRest() {
    clearTimeout(staggerTimer); staggerTimer = null;
    if (!conn) attempts.forEach(launch);
  }
  function connectCam() {
    if (!peer || peer.destroyed || peer.disconnected) { later(start, 2000); return; }
    if (!peer.open) return; // al abrirse el servidor, 'open' vuelve a llamar acá
    closeAttempts();
    if (conn) { var old = conn; conn = null; try { old.close(); } catch (e) {} }
    since = Date.now(); route = ''; connectMs = 0;
    if (cam === 'sin-red' || cam === 'apagada' || cam === 'sin-ruta') { cam = 'buscando'; camMsg = ''; render(); }
    var order = [0, 1, 2];
    if (lastSlot >= 0) { order.splice(order.indexOf(lastSlot), 1); order.unshift(lastSlot); }
    order.forEach(function (i) { attempts.push({ c: null, id: slotId(i), slot: i, gone: false, unavailable: false }); });
    if (lastSlot >= 0) { launch(attempts[0]); staggerTimer = setTimeout(launchRest, 1500); }
    else launchRest();
    clearTimeout(openTimer);
    openTimer = setTimeout(function () {
      if (conn) return;
      attempts.forEach(function (a) { a.gone = true; });
      settleFailed(); closeAttempts();
    }, 10000);
  }
  // Cómo quedaron conectados: directo por wifi, directo por internet o por relé.
  function measureRoute(c) {
    var pc = c && c.peerConnection;
    if (!pc || !pc.getStats) return;
    pc.getStats().then(function (st) {
      var pair = null, byId = {};
      st.forEach(function (r) { byId[r.id] = r; });
      st.forEach(function (r) {
        if (r.type === 'transport' && r.selectedCandidatePairId) pair = byId[r.selectedCandidatePairId];
      });
      if (!pair) st.forEach(function (r) { if (!pair && r.type === 'candidate-pair' && r.state === 'succeeded' && (r.selected || r.nominated)) pair = r; });
      if (!pair) return;
      var l = byId[pair.localCandidateId], rm = byId[pair.remoteCandidateId];
      var t = [l && l.candidateType, rm && rm.candidateType];
      route = t.indexOf('relay') >= 0 ? 'por relé' : (t[0] === 'host' && t[1] === 'host' ? 'directa por wifi' : 'directa por internet');
      render();
    }).catch(function () {});
  }
  function onData(c, m) {
    if (!m || typeof m !== 'object') return;
    if (!conn && (m.t === 'estado' || m.t === 'error')) {
      attempts.forEach(function (a) {
        if (a.c === c) { lastSlot = a.slot; try { localStorage.setItem(SLOT_KEY, String(a.slot)); } catch (e) {} }
      });
      conn = c; clearTimeout(openTimer); closeAttempts(c); lastErr = '';
      connectMs = Date.now() - since;
      setTimeout(function () { measureRoute(c); }, 300);
    }
    if (c !== conn) return;
    if (m.t === 'estado') { cam = m.s; camMsg = m.msg || ''; liveSince = m.s === 'en-vivo' ? Date.now() - (m.ms || 0) : 0; render(); }
    if (m.t === 'error') { cam = 'error'; camMsg = m.msg || ''; render(); }
  }

  // ---------- Controles ----------
  $('toggle').onclick = function () {
    if (cam === 'espera' || cam === 'error') { send({ t: 'on' }); cam = 'encendiendo'; camMsg = ''; }
    else { send({ t: 'off' }); cam = 'espera'; }
    render();
  };
  // Safari pausa el video al salir de la pantalla completa (la cruz) y queda congelado: lo retomo solo.
  function resumeVideo() {
    var v = $('video');
    if (!v.srcObject || document.hidden || cam !== 'en-vivo') return;
    v.muted = true;
    var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
  }
  ['webkitendfullscreen', 'webkitfullscreenchange', 'fullscreenchange', 'pause'].forEach(function (ev) {
    var target = (ev === 'webkitfullscreenchange' || ev === 'fullscreenchange') ? document : $('video');
    target.addEventListener(ev, function () { setTimeout(resumeVideo, 150); setTimeout(resumeVideo, 800); });
  });
  // De costado, tocar el video alterna entre llenar la pantalla y verlo entero.
  $('video').onclick = function () { $('monitor').classList.toggle('entera'); };
  $('full').onclick = function () {
    var v = $('video');
    if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    else if (v.requestFullscreen) v.requestFullscreen().catch(function () {});
  };
  $('change').onclick = function () {
    send({ t: 'off' });
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    conn = null;
    try { localStorage.removeItem(KEY); } catch (e) {}
    $('code').value = ''; $('view').hidden = true; $('setup').hidden = false;
  };
  $('save').onclick = function () {
    var c = ($('code').value || '').replace(/\s+/g, '');
    if (c.length < 6) { $('err').textContent = 'El código tiene que tener al menos 6 caracteres.'; return; }
    code = c; try { localStorage.setItem(KEY, code); } catch (e) {}
    $('err').textContent = ''; boot();
  };

  // Señal de vida cada 10 s; si se corta, la cámara se apaga sola a los 30 s.
  setInterval(function () { send({ t: 'ping' }); }, 10000);
  setInterval(function () {
    var d = new Date(); $('now').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (cam === 'en-vivo' && liveSince) $('elapsed').textContent = mmss(Date.now() - liveSince);
    if (cam === 'buscando') render();
  }, 1000);
  // Si salís de la página, apaga la cámara para cuidar la batería del 5s.
  // iOS corta las conexiones de las pestañas en segundo plano: al volver, arranca de cero.
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      hiddenAt = Date.now();
      if (cam === 'en-vivo' || cam === 'encendiendo') { send({ t: 'off' }); cam = 'espera'; render(); }
    } else if (code && !$('view').hidden && Date.now() - hiddenAt > 3000) { conn = null; start(); }
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted && code && !$('view').hidden) { conn = null; start(); } });
  window.addEventListener('pagehide', function () { send({ t: 'off' }); });
  window.addEventListener('online', function () { if (code && !$('view').hidden) start(); });
  // Vigilante: si algo quedó colgado más de 25 s, reinicia la conexión.
  setInterval(function () {
    if (!code || $('view').hidden || document.hidden) return;
    var stuck = (cam === 'sin-red' || cam === 'buscando') && Date.now() - since > 25000;
    if (!peer || peer.destroyed || peer.disconnected || stuck) { lastErr = stuck ? 'reintentando' : lastErr; start(); }
    else if (peer.open && !conn && !retry) connectCam();
    render();
  }, 10000);

  function boot() {
    $('setup').hidden = true; $('view').hidden = false;
    cam = 'sin-red'; render(); start();
  }
  if (typeof Peer === 'undefined') { $('setup').hidden = false; $('err').textContent = 'No cargó la conexión. Revisá internet y recargá.'; return; }
  if (code) boot(); else { $('setup').hidden = false; $('pill').hidden = true; }
  $('save').addEventListener('click', function () { $('pill').hidden = false; });
})();
</script>
</body>
</html>
