<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ventana">
<meta name="theme-color" content="#0d0f11">
<title>Cámara Ventana</title>
<style>
/* Visor: un monitor oscuro a propósito. El video manda; todo lo demás es tenue. Un solo tema. */
:root{
  --bg:#0d0f11;
  --surface:#16191c;
  --line:#262a2f;
  --text:#eef0f2;
  --muted:#8a9198;
  --glass:#9cc3e4;     /* acento: reflejo de vidrio */
  --ok:#47c08a;
  --live:#ff5143;
  --warn:#f0b04a;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --display:-apple-system-headline, -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{padding-top:max(14px, env(safe-area-inset-top));padding-bottom:max(18px, env(safe-area-inset-bottom));
  padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right))}
[hidden]{display:none!important}
.app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font-family:var(--display);font-size:20px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill[data-s="espera"] i{background:var(--ok)}
.pill[data-s="espera"]{color:var(--text)}
.pill[data-s="encendiendo"] i,.pill[data-s="permiso"] i{background:var(--warn)}
.pill[data-s="en-vivo"]{color:var(--text);border-color:rgba(255,81,67,.45)}
.pill[data-s="en-vivo"] i{background:var(--live);animation:pulse 1.6s ease-in-out infinite}
.pill[data-s="sin-ruta"] i{background:var(--warn)}
.pill[data-s="sin-senal"] i{background:transparent;box-shadow:0 0 0 1.5px var(--warn) inset}
.pill[data-s="error"] i{background:var(--warn)}
.pill[data-s="buscando"] i{background:var(--glass)}
.pill[data-s="apagada"] i,.pill[data-s="sin-red"] i{background:transparent;box-shadow:0 0 0 1.5px var(--muted) inset}
@keyframes pulse{50%{opacity:.3}}

/* Monitor */
.monitor{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;max-height:72vh;border-radius:18px;overflow:hidden;background:#050607;border:1px solid var(--line)}
.monitor video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.idle p{margin:0;max-width:30ch;font-size:15px;line-height:1.45;color:var(--muted)}
.idle strong{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:4px}
.pane{opacity:.9}
.monitor[data-s="encendiendo"] .pane{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
  background:linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0));font-size:12px;font-weight:700;letter-spacing:.08em;
  font-variant-numeric:tabular-nums;color:#fff;pointer-events:none}
.hud .rec{display:inline-flex;align-items:center;gap:7px}
.hud .rec i{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-in-out infinite}
.full{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:10px;border:0;background:rgba(0,0,0,.5);color:#fff;
  display:grid;place-items:center;cursor:pointer}

/* Controles */
.main{width:100%;padding:17px 20px;border-radius:16px;border:0;font:inherit;font-size:17px;font-weight:650;cursor:pointer;
  background:var(--text);color:var(--bg);transition:transform .12s ease, opacity .2s ease}
.main:active{transform:scale(.985)}
.main.off{background:transparent;color:var(--live);box-shadow:0 0 0 1.5px rgba(255,81,67,.55) inset}
.main:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--glass);outline-offset:2px}
.facts{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.facts button{font:inherit;color:var(--glass);background:none;border:0;padding:0;cursor:pointer}
.diag{font-size:12px;color:#5f666d;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}

/* Código */
.setup{display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.setup h2{margin:0;font-size:18px;font-weight:650}
.setup p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.setup input{font:inherit;font-size:19px;letter-spacing:.06em;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.err{min-height:18px;font-size:13px;color:var(--warn)}

/* Teléfono de costado con video en vivo: el monitor ocupa toda la pantalla */
@media (orientation:landscape) and (max-height:540px){
  body.live .monitor{position:fixed;left:0;top:0;width:100%;height:100%;max-height:none;aspect-ratio:auto;border-radius:0;border:0;z-index:5;background:#000}
  body.live .hud{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  body.live .full{display:none}
  body.live .monitor video{object-fit:cover}
  body.live .monitor.entera video{object-fit:contain}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2.5" y="2.5" width="21" height="21" rx="3" fill="none" stroke="#9cc3e4" stroke-width="1.6"/><path d="M13 2.5v21M2.5 13h21" stroke="#9cc3e4" stroke-width="1.6"/><path d="M5.5 9.5l3-3M15.5 19.5l3-3" stroke="#9cc3e4" stroke-width="1.2" opacity=".6"/></svg>
      <h1>Cámara Ventana</h1>
    </div>
    <span class="pill" id="pill" data-s="sin-red"><i></i><span id="pillText">Conectando</span></span>
  </header>

  <section class="setup" id="setup" hidden>
    <h2>Código de la cámara</h2>
    <p>El mismo que pusiste en el iPhone 5s. Queda guardado en este teléfono.</p>
    <input id="code" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Código">
    <button class="main" id="save" type="button">Conectar</button>
    <div class="err" id="err"></div>
  </section>

  <section id="view" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="monitor" id="monitor" data-s="sin-red">
        <video id="video" playsinline autoplay muted hidden></video>
        <div class="idle" id="idle">
          <svg class="pane" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="52" height="52" rx="6" fill="none" stroke="#9cc3e4" stroke-width="2"/><path d="M32 6v52M6 32h52" stroke="#9cc3e4" stroke-width="2"/><path d="M13 23l9-9M39 49l9-9" stroke="#9cc3e4" stroke-width="1.6" opacity=".55"/></svg>
          <p id="idleText"><strong>Conectando con la cámara</strong>Un momento.</p>
        </div>
        <div class="hud" id="hud" hidden><span class="rec"><i></i>EN VIVO <span id="elapsed">00:00</span></span><span id="now">--:--</span></div>
        <button class="full" id="full" type="button" aria-label="Pantalla completa" hidden>
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7V2h5M11 2h5v5M16 11v5h-5M7 16H2v-5" fill="none" stroke="#fff" stroke-width="1.8"/></svg>
        </button>
      </div>
      <button class="main" id="toggle" type="button" disabled>Encender cámara</button>
      <div class="facts diag"><span id="diag">Diagnóstico: iniciando</span></div>
      <div class="facts"><span id="fact">Si salís de esta pantalla, la cámara se apaga sola.</span><button id="change" type="button">Cambiar código</button></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  // ---------- Compartido entre las dos páginas (ES2017, corre en Safari 12) ----------
  var VER = 'v10.1';
  var KEY = 'camaraVentana.codigo';
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hash(str, seed) {
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed, i, ch;
    for (i = 0; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&]+)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }

  // SHA-1 / HMAC para las credenciales del relé gratuito (Open Relay, sin cuenta).
  function sha1(bytes) {
    var H = [0x67452301, 0xEFCDAB89, 0x98BADCFE, 0x10325476, 0xC3D2E1F0];
    var b = bytes.slice(), ml = bytes.length * 8, i, t, w = new Array(80);
    b.push(0x80);
    while (b.length % 64 !== 56) b.push(0);
    b.push(0, 0, 0, 0, (ml >>> 24) & 255, (ml >>> 16) & 255, (ml >>> 8) & 255, ml & 255);
    for (i = 0; i < b.length; i += 64) {
      for (t = 0; t < 16; t++) w[t] = (b[i + 4 * t] << 24) | (b[i + 4 * t + 1] << 16) | (b[i + 4 * t + 2] << 8) | b[i + 4 * t + 3];
      for (t = 16; t < 80; t++) { var x = w[t - 3] ^ w[t - 8] ^ w[t - 14] ^ w[t - 16]; w[t] = (x << 1) | (x >>> 31); }
      var a = H[0], bb = H[1], c = H[2], d = H[3], e = H[4];
      for (t = 0; t < 80; t++) {
        var f, k;

        else if (t < 40) { f = bb ^ c ^ d; k = 0x6ED9EBA1; }
        else if (t < 60) { f = (bb & c) | (bb & d) | (c & d); k = 0x8F1BBCDC; }
        else { f = bb ^ c ^ d; k = 0xCA62C1D6; }

      H[0] = (H[0] + a) | 0; H[1] = (H[1] + bb) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0;

    var out = [];
    for (i = 0; i < 5; i++) out.push((H[i] >>> 24) & 255, (H[i] >>> 16) & 255, (H[i] >>> 8) & 255, H[i] & 255);
    return out;
  }
  function bytesOf(s) { var o = []; for (var i = 0; i < s.length; i++) o.push(s.charCodeAt(i) & 255); return o; }
  function hmacSha1B64(key, msg) {
    var k = bytesOf(key), ip = [], op = [], i;
    if (k.length > 64) k = sha1(k);
    while (k.length < 64) k.push(0);
    for (i = 0; i < 64; i++) { ip.push(k[i] ^ 0x36); op.push(k[i] ^ 0x5c); }

  // Caminos para el video: directo (STUN) y dos relés de respaldo, uno por el puerto 443 que pasa casi cualquier red.
  function iceServers() {
    var user = (Math.floor(Date.now() / 1000) + 2 * 86400) + ':cventana';
    return [
      { urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] },
      { urls: ['turn:staticauth.openrelay.metered.ca:80', 'turn:staticauth.openrelay.metered.ca:443?transport=tcp'],

      { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' }
    ];
  }
  function peerOptions() {
    var o = { debug: 1, config: { iceServers: iceServers() } };
    var srv = param('srv');
    if (srv) { var p = srv.split(':'); o.host = p[0]; o.port = parseInt(p[1] || '443', 10); o.path = '/'; o.secure = o.port === 443; }

  }

  // ---------- Avisos instantáneos (ntfy.sh, gratis y sin cuenta) ----------
  // El 5s avisa "estoy en espera" y recibe "encendé" por acá, sin depender de que los teléfonos se encuentren.
  var NTFY = param('ntfy') || 'https://ntfy.sh';
  function topic(code, kind) { return 'cventana-' + hash(code, 1) + hash(code, 7) + hash(code, 11) + '-' + kind; }
  function firma(code) { return hash(code + '|ventana', 21); }
  function publish(code, kind, obj) {
    try {
      var x = new XMLHttpRequest();
      x.open('POST', NTFY + '/' + topic(code, kind), true);
      x.send(JSON.stringify(obj));
    } catch (e) {}
  }
  // Suscripción con reconexión: si no llega nada (ni el "keepalive" de ntfy) en 100 s, se reabre.
  function subscribe(code, kind, since, onMsg, onAlive) {

  // ---------- Estado ----------
  // cam: lo que informa el 5s en su último aviso. Si el aviso es viejo, se muestra "sin señal".
  var cam = 'buscando', camMsg = '', camLista = true, lastSeen = 0, liveSince = 0, msgOk = false;
  var want = false, wantSince = 0, hasVideo = false, route = '', lastErr = '';
  var PILL = { 'buscando': 'Buscando', 'sin-senal': 'Sin señal', 'espera': 'En espera', 'encendiendo': 'Encendiendo',
    'en-vivo': 'En vivo', 'permiso': 'Falta permiso', 'error': 'Atención' };
  var IDLE = {
    'buscando': ['Escuchando al 5s', 'Cada 30 segundos el 5s avisa que está despierto. En segundos aparece acá.'],
    'sin-senal': ['El 5s no avisa desde las ', 'Puede haberse quedado sin batería, sin wifi o con Safari cerrado. Cuando vuelva, aparece solo.'],
    'espera': ['La cámara está en espera', 'Tocá Encender para verla en vivo.'],
    'encendiendo': ['Encendiendo la cámara', 'El 5s ya recibió la orden. El video llega en unos segundos.'],
    'permiso': ['El 5s está pidiendo permiso', 'Safari quiere confirmar el uso de la cámara: hay que tocar Permitir en el 5s.'],
    'error': ['La cámara avisó un problema', ''],
    'en-vivo': ['Conectando el video', 'La cámara ya está transmitiendo. Un instante.']

    if (!lastSeen) return 'buscando';

    $('pillText').textContent = live ? PILL['en-vivo'] : (PILL[st] || st);

    $('video').hidden = !live; $('hud').hidden = !live; $('full').hidden = !live;
    $('idle').hidden = live;
    document.body.className = live ? 'live' : '';
    var t = IDLE[st] || IDLE['espera'];
    $('idleText').innerHTML = '';
    var s = document.createElement('strong');
    s.textContent = st === 'sin-senal' ? t[0] + hhmm(lastSeen) : t[0];
    $('idleText').appendChild(s);
    $('idleText').appendChild(document.createTextNode(camMsg && (st === 'espera' || st === 'error') ? camMsg : t[1]));

    btn.textContent = want ? 'Apagar cámara' : 'Encender cámara';
    btn.className = want ? 'main off' : 'main';

  }

  // ---------- Avisos del 5s ----------
  var sub = null;

    if (sub) sub.close();
    // since=3m: al abrir, trae el último aviso guardado y muestra el estado al instante.

      lastSeen = Math.min(when, Date.now());

      render();
    }, function (ok) { msgOk = ok; render(); });
    publish(code, 'cam', { t: 'hola', k: firma(code) });
  }

  // ---------- Video ----------
  var peer = null, call = null, restartTimer = null, noVideoTimer = null;
  function startPeer() {
    clearTimeout(restartTimer); restartTimer = null;
    if (peer) { var old = peer; peer = null; try { old.destroy(); } catch (e) {} }
    var p = new Peer(peerOptions());
    peer = p;
    p.on('open', function () { if (p !== peer) return; render(); if (want) sendOn(); });
    p.on('call', function (c) {
      if (call && call !== c) { try { call.close(); } catch (e) {} }
      call = c;
      c.answer();
      c.on('stream', function (s) {
        var v = $('video'); v.srcObject = s;
        var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
        hasVideo = true; lastErr = ''; clearTimeout(noVideoTimer); render();
        v.onloadedmetadata = v.onresize = function () {
          if (v.videoWidth && v.videoHeight) $('monitor').style.aspectRatio = v.videoWidth + ' / ' + v.videoHeight;
        };
        setTimeout(function () { measureRoute(c); }, 1500);
      });
      var end = function () { if (call === c) { call = null; hasVideo = false; route = ''; $('video').srcObject = null; render(); } };
      c.on('close', end); c.on('error', end);
    });
    p.on('disconnected', function () { if (p === peer) setTimeout(function () { if (p === peer && p.disconnected && !p.destroyed) { try { p.reconnect(); } catch (e) { startSoon(); } } }, 1500); });
    p.on('error', function (err) { if (p === peer && !(err && err.type === 'peer-unavailable')) { lastErr = 'video: ' + (err && err.type); render(); startSoon(); } });
  }
  function startSoon() { if (!restartTimer) restartTimer = setTimeout(startPeer, 3000); }
  function measureRoute(c) {
    var pc = c && c.peerConnection;
    if (!pc || !pc.getStats) return;
    pc.getStats().then(function (st) {
      var pair = null, byId = {};
      st.forEach(function (r) { byId[r.id] = r; });
      st.forEach(function (r) { if (r.type === 'transport' && r.selectedCandidatePairId) pair = byId[r.selectedCandidatePairId]; });
      if (!pair) st.forEach(function (r) { if (!pair && r.type === 'candidate-pair' && r.state === 'succeeded' && (r.selected || r.nominated)) pair = r; });
      if (!pair) return;
      var l = byId[pair.localCandidateId], rm = byId[pair.remoteCandidateId];
      var t = [l && l.candidateType, rm && rm.candidateType];
      route = t.indexOf('relay') >= 0 ? 'por relé' : (t[0] === 'host' && t[1] === 'host' ? 'directo por wifi' : 'directo por internet');
      route += ' en ' + ((Date.now() - wantSince) / 1000).toFixed(1) + ' s';
      render();
    }).catch(function () {});
  }

  // ---------- Encender / apagar ----------
  function sendOn() { if (peer && peer.open) publish(code, 'cam', { t: 'on', v: peer.id, k: firma(code) }); }
  function setWant(on) {
    want = on; lastErr = '';
    if (on) {
      wantSince = Date.now(); sendOn();
      clearTimeout(noVideoTimer);
      noVideoTimer = setTimeout(function () { if (want && !hasVideo) { lastErr = 'el video tarda: reintentando'; render(); sendOn(); } }, 15000);
    } else {
      clearTimeout(noVideoTimer);
      publish(code, 'cam', { t: 'off', v: peer && peer.id, k: firma(code) });
      if (call) { try { call.close(); } catch (e) {} call = null; }
      hasVideo = false; route = '';
    }
    render();
  }
  $('toggle').onclick = function () { setWant(!want); };
  // Mientras mirás, una señal cada 10 s. Si se corta, el 5s vuelve a reposo solo a los 30 s.
  setInterval(function () { if (want && peer && peer.open) publish(code, 'cam', { t: 'ping', v: peer.id, k: firma(code) }); }, 10000);

  // Safari pausa el video al salir de la pantalla completa (la cruz): lo retomo solo.
  function resumeVideo() {
    var v = $('video');
    if (!v.srcObject || document.hidden || !hasVideo) return;
    v.muted = true; var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
  }
  ['webkitendfullscreen', 'pause'].forEach(function (ev) { $('video').addEventListener(ev, function () { setTimeout(resumeVideo, 150); setTimeout(resumeVideo, 800); }); });
  ['webkitfullscreenchange', 'fullscreenchange'].forEach(function (ev) { document.addEventListener(ev, function () { setTimeout(resumeVideo, 150); setTimeout(resumeVideo, 800); }); });
  $('video').onclick = function () { $('monitor').classList.toggle('entera'); };
  $('full').onclick = function () {
    var v = $('video');
    if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    else if (v.requestFullscreen) v.requestFullscreen().catch(function () {});
  };
  $('change').onclick = function () {
    if (want) setWant(false);
    if (sub) { sub.close(); sub = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    try { localStorage.removeItem(KEY); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    lastSeen = 0; cam = 'buscando';
    $('code').value = ''; $('view').hidden = true; $('setup').hidden = false;
  };
  $('save').onclick = function () {
    var c = ($('code').value || '').replace(/\s+/g, '');
    if (c.length < 6) { $('err').textContent = 'El código tiene que tener al menos 6 caracteres.'; return; }
    code = c; try { localStorage.setItem(KEY, code); } catch (e) {}
    $('err').textContent = ''; $('pill').hidden = false; boot();
  };

  setInterval(function () {
    var d = new Date(); $('now').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (hasVideo && liveSince) $('elapsed').textContent = mmss(Date.now() - liveSince);
    else if (hasVideo) $('elapsed').textContent = mmss(Date.now() - wantSince);
    render();
  }, 1000);
  // Al salir de la pantalla, apaga la cámara para cuidar la batería del 5s. Al volver, reconecta al instante.
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); if (want) setWant(false); return; }
    if (!code || $('view').hidden) return;
    if (Date.now() - hiddenAt > 3000) { if (sub) sub.reopen(); publish(code, 'cam', { t: 'hola', k: firma(code) }); }
    if (!peer || peer.destroyed || peer.disconnected) startPeer();
  });
  window.addEventListener('pagehide', function () { if (want) publish(code, 'cam', { t: 'off', v: peer && peer.id, k: firma(code) }); });
  window.addEventListener('online', function () { if (code && !$('view').hidden) { if (sub) sub.reopen(); startPeer(); } });
  setInterval(function () {
    if (!code || $('view').hidden || document.hidden) return;
    if (!peer || peer.destroyed) startPeer();
    else if (peer.disconnected) { try { peer.reconnect(); } catch (e) { startPeer(); } }
  }, 10000);

  function boot() {
    keepCodeInUrl();
    $('setup').hidden = true; $('view').hidden = false;
    lastSeen = 0; cam = 'buscando'; render();
    listen(); startPeer();
  }
  if (typeof Peer === 'undefined') { $('setup').hidden = false; $('err').textContent = 'No cargó la conexión. Revisá internet y recargá.'; return; }
  if (code) boot(); else { $('setup').hidden = false; $('pill').hidden = true; }
})();
</script>
